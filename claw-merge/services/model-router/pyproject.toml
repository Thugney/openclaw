[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msclaw-model-router"
version = "0.1.0"
description = "MSClaw model router – local-first with cloud fallback"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109,<1",
    "uvicorn[standard]>=0.27,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
    "msclaw-shared",
]
