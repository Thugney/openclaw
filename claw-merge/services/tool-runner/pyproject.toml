[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msclaw-tool-runner"
version = "0.1.0"
description = "MSClaw tool runner – sandboxed tool execution with idempotency"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109,<1",
    "uvicorn[standard]>=0.27,<1",
    "asyncpg>=0.29,<1",
    "nats-py>=2.6,<3",
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
    "python-ulid>=2.2,<3",
    "miniopy-async>=1.19,<2",
    "msal>=1.26,<2",
    "msclaw-shared",
]
