[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msclaw-control-api"
version = "0.1.0"
description = "MSClaw control API – auth, RBAC, workflow submission, policy enforcement"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109,<1",
    "uvicorn[standard]>=0.27,<1",
    "asyncpg>=0.29,<1",
    "nats-py>=2.6,<3",
    "pydantic>=2.5,<3",
    "python-ulid>=2.2,<3",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "httpx>=0.27,<1",
    "msclaw-shared",
]
