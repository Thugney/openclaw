[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msclaw-shared"
version = "0.1.0"
description = "MSClaw shared contracts, models, and utilities"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
    "nats-py>=2.6,<3",
    "asyncpg>=0.29,<1",
    "python-ulid>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.2",
]
