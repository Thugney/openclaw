[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msclaw-cli"
version = "0.1.0"
description = "MSClaw CLI – thin client for security workflows"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "typer>=0.9,<1",
    "rich>=13.7,<14",
]

[project.scripts]
msclaw = "msclaw_cli.main:app"
