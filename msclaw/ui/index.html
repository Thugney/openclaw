<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSClaw – Security Operations Runtime</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: #2a2d3a;
            --text: #e1e4eb;
            --text-dim: #8b8fa3;
            --accent: #3b82f6;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #06b6d4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; background: var(--bg); color: var(--text); }
        .app { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: 56px 1fr; height: 100vh; }
        header { grid-column: 1 / -1; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 16px; }
        header h1 { font-size: 18px; font-weight: 600; }
        header .badge { font-size: 11px; background: var(--accent); padding: 2px 8px; border-radius: 10px; }
        nav { background: var(--surface); border-right: 1px solid var(--border); padding: 16px 0; }
        nav a { display: block; padding: 10px 20px; color: var(--text-dim); text-decoration: none; font-size: 14px; cursor: pointer; }
        nav a:hover, nav a.active { color: var(--text); background: rgba(59,130,246,0.1); border-left: 3px solid var(--accent); }
        main { padding: 24px; overflow-y: auto; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .card h2 { font-size: 16px; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .status { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .status.completed { background: rgba(34,197,94,0.15); color: var(--success); }
        .status.running { background: rgba(59,130,246,0.15); color: var(--accent); }
        .status.pending { background: rgba(245,158,11,0.15); color: var(--warning); }
        .status.failed, .status.rejected { background: rgba(239,68,68,0.15); color: var(--danger); }
        .status.awaiting_approval { background: rgba(245,158,11,0.15); color: var(--warning); }
        .status.approved { background: rgba(34,197,94,0.15); color: var(--success); }
        .status.denied { background: rgba(239,68,68,0.15); color: var(--danger); }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        input, select, textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 13px; width: 100%; }
        .form-row { margin-bottom: 12px; }
        .form-row label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
        .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
        .corr-id { color: var(--info); font-size: 11px; cursor: pointer; }
        .corr-id:hover { text-decoration: underline; }
        .timeline { position: relative; padding-left: 24px; }
        .timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--border); }
        .timeline-item { position: relative; margin-bottom: 16px; padding: 12px; background: var(--bg); border-radius: 6px; border: 1px solid var(--border); }
        .timeline-item::before { content: ''; position: absolute; left: -20px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
        .timeline-item.completed::before { background: var(--success); }
        .timeline-item.running::before { background: var(--accent); }
        .timeline-item.failed::before { background: var(--danger); }
        .timeline-item.pending::before { background: var(--text-dim); }
        .flex { display: flex; gap: 8px; align-items: center; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .hidden { display: none; }
        .empty { text-align: center; color: var(--text-dim); padding: 40px; }
        .hash { color: var(--text-dim); font-family: monospace; font-size: 11px; }
        .tab-bar { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
        .tab { padding: 10px 20px; cursor: pointer; color: var(--text-dim); font-size: 13px; border-bottom: 2px solid transparent; }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        #loading { text-align: center; padding: 20px; color: var(--text-dim); }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>MSClaw</h1>
        <span class="badge">Runtime</span>
        <div style="flex:1"></div>
        <span id="conn-status" style="font-size:12px; color: var(--text-dim)">Connecting...</span>
    </header>
    <nav>
        <a class="active" data-view="workflows" onclick="showView('workflows')">Workflows</a>
        <a data-view="runs" onclick="showView('runs')">Run History</a>
        <a data-view="approvals" onclick="showView('approvals')">Approvals Queue</a>
        <a data-view="audit" onclick="showView('audit')">Audit Ledger</a>
        <a data-view="artifacts" onclick="showView('artifacts')">Artifacts</a>
        <a data-view="submit" onclick="showView('submit')">Submit Workflow</a>
    </nav>
    <main>
        <!-- Workflows view -->
        <div id="view-workflows">
            <div class="card">
                <div class="flex-between">
                    <h2>Workflows</h2>
                    <button class="btn btn-primary" onclick="showView('submit')">+ New Run</button>
                </div>
                <div id="workflows-list"><div id="loading">Loading...</div></div>
            </div>
        </div>

        <!-- Runs view -->
        <div id="view-runs" class="hidden">
            <div class="card">
                <h2>Run History</h2>
                <div id="runs-list"></div>
            </div>
        </div>

        <!-- Run detail view -->
        <div id="view-run-detail" class="hidden">
            <div class="card">
                <div class="flex-between">
                    <h2>Run Timeline</h2>
                    <button class="btn" onclick="showView('runs')" style="background: var(--border)">Back</button>
                </div>
                <div id="run-meta"></div>
                <div id="run-timeline" class="timeline" style="margin-top: 16px"></div>
                <h3 style="margin: 16px 0 8px; font-size: 14px; color: var(--text-dim)">Audit Trail</h3>
                <div id="run-audit"></div>
            </div>
        </div>

        <!-- Approvals view -->
        <div id="view-approvals" class="hidden">
            <div class="card">
                <h2>Approvals Queue</h2>
                <div class="tab-bar">
                    <div class="tab active" onclick="loadApprovals('pending', this)">Pending</div>
                    <div class="tab" onclick="loadApprovals('all', this)">All</div>
                </div>
                <div id="approvals-list"></div>
            </div>
        </div>

        <!-- Audit view -->
        <div id="view-audit" class="hidden">
            <div class="card">
                <div class="flex-between">
                    <h2>Audit Ledger</h2>
                    <button class="btn btn-primary" onclick="verifyChain()">Verify Chain</button>
                </div>
                <div id="chain-verify-result" style="margin: 8px 0; display: none;"></div>
                <div id="audit-list"></div>
            </div>
        </div>

        <!-- Artifacts view -->
        <div id="view-artifacts" class="hidden">
            <div class="card">
                <h2>Artifacts (MinIO)</h2>
                <div id="artifacts-list"></div>
            </div>
        </div>

        <!-- Submit view -->
        <div id="view-submit" class="hidden">
            <div class="card">
                <h2>Submit Workflow Run</h2>
                <div class="form-row">
                    <label>Workflow</label>
                    <select id="workflow-select"><option value="">Loading...</option></select>
                </div>
                <div class="form-row">
                    <label>Parameters (JSON)</label>
                    <textarea id="run-params" rows="6" class="mono" placeholder='{"incident_id": "INC-001"}'></textarea>
                </div>
                <div class="form-row">
                    <label>Initiated By</label>
                    <input id="run-actor" value="soc_analyst@contoso.com" />
                </div>
                <div class="form-row">
                    <label>Idempotency Key (optional)</label>
                    <input id="run-idem-key" placeholder="Leave blank to auto-generate" />
                </div>
                <div class="form-row" style="margin-top: 16px">
                    <button class="btn btn-primary" onclick="submitRun()">Submit Run</button>
                </div>
                <div id="submit-result" style="margin-top: 12px; display: none;"></div>
            </div>
        </div>
    </main>
</div>

<script>
const API = window.location.origin.replace(/:\d+$/, ':8080');

async function api(path, opts = {}) {
    const resp = await fetch(`${API}${path}`, {
        headers: { 'Content-Type': 'application/json', ...opts.headers },
        ...opts,
    });
    if (!resp.ok) {
        const err = await resp.text();
        throw new Error(`${resp.status}: ${err}`);
    }
    return resp.json();
}

function showView(name) {
    document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
    document.getElementById(`view-${name}`).classList.remove('hidden');
    document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.view === name));
    if (name === 'workflows') loadWorkflows();
    if (name === 'runs') loadRuns();
    if (name === 'approvals') loadApprovals('pending');
    if (name === 'audit') loadAudit();
    if (name === 'artifacts') loadArtifacts();
    if (name === 'submit') loadWorkflowSelect();
}

// --- Workflows ---
async function loadWorkflows() {
    try {
        const wfs = await api('/api/v1/workflows');
        const el = document.getElementById('workflows-list');
        if (!wfs.length) { el.innerHTML = '<div class="empty">No workflows defined. Seed one via the smoke test.</div>'; return; }
        el.innerHTML = `<table><thead><tr><th>Name</th><th>Steps</th><th>Created</th><th>ID</th></tr></thead><tbody>${
            wfs.map(w => `<tr><td><strong>${w.name}</strong><br><small style="color:var(--text-dim)">${w.description || ''}</small></td>
                <td>${(w.steps||[]).length}</td><td>${w.created_at ? new Date(w.created_at).toLocaleString() : '-'}</td>
                <td class="mono" style="font-size:11px">${w.id.slice(0,8)}</td></tr>`).join('')
        }</tbody></table>`;
    } catch(e) { document.getElementById('workflows-list').innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

// --- Runs ---
async function loadRuns() {
    try {
        const runs = await api('/api/v1/runs');
        const el = document.getElementById('runs-list');
        if (!runs.length) { el.innerHTML = '<div class="empty">No runs yet.</div>'; return; }
        el.innerHTML = `<table><thead><tr><th>ID</th><th>Status</th><th>Initiated By</th><th>Created</th><th>Correlation ID</th><th></th></tr></thead><tbody>${
            runs.map(r => `<tr>
                <td class="mono">${r.id.slice(0,8)}</td>
                <td><span class="status ${r.status}">${r.status}</span></td>
                <td>${r.initiated_by}</td>
                <td>${r.created_at ? new Date(r.created_at).toLocaleString() : '-'}</td>
                <td class="corr-id" onclick="showAuditForCorrelation('${r.correlation_id}')">${r.correlation_id.slice(0,12)}...</td>
                <td><button class="btn" style="background:var(--border);padding:4px 10px;font-size:11px" onclick="showRunDetail('${r.id}')">View</button></td>
            </tr>`).join('')
        }</tbody></table>`;
    } catch(e) { document.getElementById('runs-list').innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

async function showRunDetail(runId) {
    showView('run-detail');
    try {
        const timeline = await api(`/api/v1/runs/${runId}/timeline`);
        document.getElementById('run-meta').innerHTML = `
            <div class="flex" style="gap:20px;margin-top:12px">
                <div><span style="color:var(--text-dim);font-size:12px">Run ID</span><br><span class="mono">${timeline.run_id}</span></div>
                <div><span style="color:var(--text-dim);font-size:12px">Correlation ID</span><br><span class="corr-id mono" onclick="showAuditForCorrelation('${timeline.correlation_id}')">${timeline.correlation_id}</span></div>
                <div><span style="color:var(--text-dim);font-size:12px">Status</span><br><span class="status ${timeline.status}">${timeline.status}</span></div>
            </div>`;
        document.getElementById('run-timeline').innerHTML = timeline.steps.map(s => `
            <div class="timeline-item ${s.status}">
                <div class="flex-between">
                    <strong>${s.name}</strong>
                    <span class="status ${s.status}">${s.status}</span>
                </div>
                <div style="color:var(--text-dim);font-size:12px;margin-top:4px">Tool: ${s.tool} | Started: ${s.started_at || '-'} | Completed: ${s.completed_at || '-'}</div>
                ${s.error ? `<div style="color:var(--danger);font-size:12px;margin-top:4px">${s.error}</div>` : ''}
                ${s.output ? `<pre class="mono" style="margin-top:8px;padding:8px;background:var(--bg);border-radius:4px;overflow-x:auto;max-height:200px">${JSON.stringify(s.output, null, 2)}</pre>` : ''}
            </div>`).join('');
        document.getElementById('run-audit').innerHTML = `<table><thead><tr><th>Action</th><th>Actor</th><th>Policy</th><th>Tool</th><th>Hash</th><th>Time</th></tr></thead><tbody>${
            timeline.audit.map(a => `<tr>
                <td>${a.action}</td><td>${a.actor}</td><td>${a.policy_decision || '-'}</td>
                <td>${a.tool || '-'}</td><td class="hash">${a.entry_hash}</td>
                <td style="font-size:11px">${a.created_at ? new Date(a.created_at).toLocaleString() : '-'}</td></tr>`).join('')
        }</tbody></table>`;
    } catch(e) { document.getElementById('run-meta').innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

// --- Approvals ---
async function loadApprovals(status, tabEl) {
    if (tabEl) { document.querySelectorAll('#view-approvals .tab').forEach(t => t.classList.remove('active')); tabEl.classList.add('active'); }
    try {
        const approvals = await api(`/api/v1/approvals?status=${status}`);
        const el = document.getElementById('approvals-list');
        if (!approvals.length) { el.innerHTML = '<div class="empty">No approvals.</div>'; return; }
        el.innerHTML = `<table><thead><tr><th>ID</th><th>Reason</th><th>Status</th><th>Requested</th><th>Correlation</th><th>Actions</th></tr></thead><tbody>${
            approvals.map(a => `<tr>
                <td class="mono">${a.id.slice(0,8)}</td>
                <td style="max-width:300px">${a.reason}</td>
                <td><span class="status ${a.status}">${a.status}</span></td>
                <td style="font-size:11px">${a.requested_at ? new Date(a.requested_at).toLocaleString() : '-'}</td>
                <td class="corr-id" onclick="showAuditForCorrelation('${a.correlation_id}')">${a.correlation_id.slice(0,12)}...</td>
                <td>${a.status === 'pending' ? `
                    <div class="flex"><button class="btn btn-success" style="padding:4px 10px;font-size:11px" onclick="decideApproval('${a.id}','approved')">Approve</button>
                    <button class="btn btn-danger" style="padding:4px 10px;font-size:11px" onclick="decideApproval('${a.id}','denied')">Deny</button></div>` : (a.decided_by || '-')}</td>
            </tr>`).join('')
        }</tbody></table>`;
    } catch(e) { document.getElementById('approvals-list').innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

async function decideApproval(id, decision) {
    const who = prompt('Your identity:', 'security_lead@contoso.com');
    if (!who) return;
    try {
        await api(`/api/v1/approvals/${id}`, {
            method: 'POST',
            body: JSON.stringify({ decision, decided_by: who }),
        });
        loadApprovals('pending');
    } catch(e) { alert(`Error: ${e.message}`); }
}

// --- Audit ---
async function loadAudit() {
    try {
        const entries = await api('/api/v1/audit?limit=100');
        const el = document.getElementById('audit-list');
        if (!entries.length) { el.innerHTML = '<div class="empty">No audit entries.</div>'; return; }
        el.innerHTML = `<table><thead><tr><th>#</th><th>Action</th><th>Actor</th><th>Policy</th><th>Tool</th><th>Mode</th><th>Correlation</th><th>Hash</th><th>Time</th></tr></thead><tbody>${
            entries.map(e => `<tr>
                <td>${e.id}</td><td>${e.action}</td><td>${e.actor}</td>
                <td>${e.policy_decision || '-'}</td><td>${e.tool || '-'}</td>
                <td>${e.adapter_mode || '-'}</td>
                <td class="corr-id" onclick="showAuditForCorrelation('${e.correlation_id}')">${e.correlation_id.slice(0,12)}...</td>
                <td class="hash">${e.entry_hash.slice(0,12)}</td>
                <td style="font-size:11px">${e.created_at ? new Date(e.created_at).toLocaleString() : '-'}</td></tr>`).join('')
        }</tbody></table>`;
    } catch(e) { document.getElementById('audit-list').innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

async function showAuditForCorrelation(corrId) {
    showView('audit');
    try {
        const entries = await api(`/api/v1/audit?correlation_id=${corrId}`);
        const el = document.getElementById('audit-list');
        el.innerHTML = `<div style="margin-bottom:12px;font-size:12px;color:var(--info)">Filtered by correlation: ${corrId}</div>` +
            `<table><thead><tr><th>#</th><th>Action</th><th>Actor</th><th>Policy</th><th>Tool</th><th>Hash Chain</th><th>Time</th></tr></thead><tbody>${
            entries.map(e => `<tr><td>${e.id}</td><td>${e.action}</td><td>${e.actor}</td>
                <td>${e.policy_decision || '-'}</td><td>${e.tool || '-'}</td>
                <td class="hash">${(e.prev_hash||'').slice(0,8)} → ${e.entry_hash.slice(0,8)}</td>
                <td style="font-size:11px">${e.created_at ? new Date(e.created_at).toLocaleString() : '-'}</td></tr>`).join('')
        }</tbody></table>`;
    } catch(e) { document.getElementById('audit-list').innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

async function verifyChain() {
    const el = document.getElementById('chain-verify-result');
    el.style.display = 'block';
    el.innerHTML = '<span style="color:var(--text-dim)">Verifying...</span>';
    try {
        const result = await api('/api/v1/audit/verify', { method: 'POST' });
        if (result.valid) {
            el.innerHTML = '<span style="color:var(--success);font-weight:600">PASS – Audit chain integrity verified</span>';
        } else {
            el.innerHTML = `<span style="color:var(--danger);font-weight:600">FAIL – ${result.errors.length} errors</span><ul style="margin-top:8px">${result.errors.map(e => `<li style="color:var(--danger);font-size:12px">${e}</li>`).join('')}</ul>`;
        }
    } catch(e) { el.innerHTML = `<span style="color:var(--danger)">Error: ${e.message}</span>`; }
}

// --- Artifacts ---
async function loadArtifacts() {
    try {
        const arts = await api('/api/v1/artifacts');
        const el = document.getElementById('artifacts-list');
        if (!arts.length) { el.innerHTML = '<div class="empty">No artifacts.</div>'; return; }
        el.innerHTML = `<table><thead><tr><th>Key</th><th>Size</th><th>Last Modified</th><th>ETag</th></tr></thead><tbody>${
            arts.map(a => `<tr><td class="mono">${a.key}</td><td>${a.size ? (a.size/1024).toFixed(1) + 'KB' : '-'}</td>
                <td style="font-size:11px">${a.last_modified || '-'}</td><td class="hash">${(a.etag||'').slice(0,12)}</td></tr>`).join('')
        }</tbody></table>`;
    } catch(e) { document.getElementById('artifacts-list').innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

// --- Submit ---
async function loadWorkflowSelect() {
    try {
        const wfs = await api('/api/v1/workflows');
        const sel = document.getElementById('workflow-select');
        sel.innerHTML = wfs.map(w => `<option value="${w.id}">${w.name}</option>`).join('') || '<option>No workflows</option>';
    } catch(e) { /* ignore */ }
}

async function submitRun() {
    const wfId = document.getElementById('workflow-select').value;
    const paramsStr = document.getElementById('run-params').value.trim();
    const actor = document.getElementById('run-actor').value.trim();
    const idemKey = document.getElementById('run-idem-key').value.trim();
    const el = document.getElementById('submit-result');
    el.style.display = 'block';

    let params = {};
    if (paramsStr) {
        try { params = JSON.parse(paramsStr); } catch(e) { el.innerHTML = `<span style="color:var(--danger)">Invalid JSON</span>`; return; }
    }

    try {
        const headers = {};
        if (idemKey) headers['Idempotency-Key'] = idemKey;
        const result = await api('/api/v1/runs', {
            method: 'POST',
            headers,
            body: JSON.stringify({ workflow_id: wfId, params, initiated_by: actor }),
        });
        if (result.status === 'duplicate') {
            el.innerHTML = `<span style="color:var(--warning)">Duplicate: prior result returned (idempotency hit)</span><pre class="mono" style="margin-top:8px">${JSON.stringify(result, null, 2)}</pre>`;
        } else {
            el.innerHTML = `<span style="color:var(--success)">Run submitted!</span><pre class="mono" style="margin-top:8px">${JSON.stringify(result, null, 2)}</pre>`;
        }
    } catch(e) {
        el.innerHTML = `<span style="color:var(--danger)">Error: ${e.message}</span>`;
    }
}

// Init
document.getElementById('conn-status').textContent = `API: ${API}`;
loadWorkflows();
</script>
</body>
</html>
