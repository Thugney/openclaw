# MSClaw CI Pipeline
# .github/workflows/ci.yml

name: MSClaw CI

on:
  push:
    branches: [main]
    paths: ['msclaw/**']
  pull_request:
    branches: [main]
    paths: ['msclaw/**']

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: msclaw

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy shared/ plugins/ services/ cli/ --ignore-missing-imports

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: msclaw

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --cov=shared --cov=plugins --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: msclaw

  opa-test:
    name: OPA Policy Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Run policy tests
        run: |
          cd msclaw/policies
          opa test rego/ -v

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, opa-test]
    defaults:
      run:
        working-directory: msclaw

    steps:
      - uses: actions/checkout@v4

      - name: Build control-api image
        run: docker build -f deploy/docker/Dockerfile.control-api -t msclaw/control-api:ci .

      - name: Build ui-web image
        run: docker build -f deploy/docker/Dockerfile.ui-web -t msclaw/ui-web:ci .

  ui-lint:
    name: UI Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: msclaw/services/ui-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
